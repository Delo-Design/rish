<VirtualHost *:80>
ServerAdmin webmaster@localhost
ServerName 000-default
ServerAlias www.000-default
DocumentRoot /var/www/html/000-default
<Directory /var/www/html/000-default>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Order allow,deny
    allow from all
</Directory>
ServerSignature Off
ErrorLog /var/log/httpd/000-default-error-log
LogLevel warn
CustomLog /var/log/httpd/000-default-access-log combined
</VirtualHost>
