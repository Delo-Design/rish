ServerTokens Prod
ServerSignature Off

<IfModule mod_headers.c>
    Header always unset X-Powered-By
</IfModule>

<VirtualHost *:443>
ServerAdmin webmaster@localhost
ServerName 000-default
ServerAlias www.000-default
DocumentRoot /var/www/html/000-default
<Directory /var/www/html/000-default>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Order allow,deny
    allow from all
    deny from all
</Directory>
ServerSignature Off
ErrorLog /var/log/httpd/000-default-error-log
LogLevel warn
CustomLog /var/log/httpd/000-default-access-log combined
SSLCertificateFile /etc/pki/tls/certs/localhost.crt
SSLCertificateKeyFile /etc/pki/tls/private/localhost.key
</VirtualHost>
